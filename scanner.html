<!DOCTYPE html><html lang="id"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1.0,maximum-scale=1.0,user-scalable=no"><title>Scan QR Code</title><script src="https://cdnjs.cloudflare.com/ajax/libs/html5-qrcode/2.3.8/html5-qrcode.min.js"></script><style>body{margin:0;background:#111827;color:#fff;font-family:Arial,sans-serif;text-align:center}.header{padding:18px;background:#1f2937}.header h2{margin:0 0 6px}.header p{margin:0;color:#cbd5e1;font-size:13px}#reader{width:100%;max-width:500px;margin:20px auto}.status{padding:10px 20px;color:#cbd5e1;font-size:14px}.success{color:#22c55e}.error{color:#ef4444}button{margin:15px;padding:13px 25px;border:0;border-radius:10px;background:#ef4444;color:#fff;font-size:15px}</style></head><body><div class="header"><h2>Scan QR Code</h2><p>Arahkan kamera HP ke QR Code</p></div><div id="reader"></div><div id="status" class="status">Memulai kamera...</div><button onclick="closeScanner()">Tutup Kamera</button><script>let scanner=null,scanned=false;function startScanner(){scanner=new Html5Qrcode('reader');const config={fps:10,qrbox:function(w,h){const s=Math.min(w,h);const q=Math.min(280,s*.75);return{width:q,height:q}},aspectRatio:1};scanner.start({facingMode:'environment'},config,function(decodedText){if(scanned)return;scanned=true;document.getElementById('status').innerHTML='<span class="success">QR Code berhasil dibaca!</span>';if(navigator.vibrate)navigator.vibrate(200);scanner.stop().then(function(){sendResult(decodedText)}).catch(function(){sendResult(decodedText)});}).then(function(){document.getElementById('status').textContent='Kamera aktif — arahkan ke QR Code'}).catch(function(error){console.error(error);document.getElementById('status').innerHTML='<span class="error">Kamera tidak dapat digunakan.<br>Pastikan izin kamera sudah diberikan.</span>'})}function sendResult(code){if(window.opener&&!window.opener.closed){window.opener.postMessage({type:'QR_SCANNED',code:code},'*');setTimeout(function(){window.close()},500)}else document.getElementById('status').innerHTML='<span class="error">Halaman aplikasi utama tidak ditemukan.</span>'}function closeScanner(){if(scanner){scanner.stop().catch(function(){}).finally(function(){window.close()})}else window.close()}window.addEventListener('load',startScanner);</script></body></html>
